<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- top chrome hoop row 1 -->
  <rect x="1" y="1" width="14" height="1" fill="#C0C0D4"/>
  <!-- top drum head rows 2-3, chrome sides -->
  <rect x="0" y="2" width="1" height="2" fill="#C0C0D4"/>
  <rect x="1" y="2" width="14" height="2" fill="#E0E0D8"/>
  <rect x="15" y="2" width="1" height="2" fill="#C0C0D4"/>
  <!-- upper hoop row 4 -->
  <rect x="1" y="4" width="14" height="1" fill="#C0C0D4"/>
  <!-- shell rows 5-6: chrome walls, black body -->
  <rect x="1" y="5" width="1" height="2" fill="#C0C0D4"/>
  <rect x="2" y="5" width="12" height="2" fill="#141414"/>
  <rect x="14" y="5" width="1" height="2" fill="#C0C0D4"/>
  <!-- snare wires row 7: alternating silver/black -->
  <rect x="1" y="7" width="1" height="1" fill="#C0C0D4"/>
  <rect x="2" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="3" y="7" width="1" height="1" fill="#141414"/>
  <rect x="4" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="5" y="7" width="1" height="1" fill="#141414"/>
  <rect x="6" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="7" y="7" width="1" height="1" fill="#141414"/>
  <rect x="8" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="9" y="7" width="1" height="1" fill="#141414"/>
  <rect x="10" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="11" y="7" width="1" height="1" fill="#141414"/>
  <rect x="12" y="7" width="1" height="1" fill="#A4A4BC"/>
  <rect x="13" y="7" width="1" height="1" fill="#141414"/>
  <rect x="14" y="7" width="1" height="1" fill="#C0C0D4"/>
  <!-- shell rows 8-9 -->
  <rect x="1" y="8" width="1" height="2" fill="#C0C0D4"/>
  <rect x="2" y="8" width="12" height="2" fill="#141414"/>
  <rect x="14" y="8" width="1" height="2" fill="#C0C0D4"/>
  <!-- lower hoop row 10 -->
  <rect x="1" y="10" width="14" height="1" fill="#C0C0D4"/>
  <!-- bottom drum head rows 11-12 -->
  <rect x="0" y="11" width="1" height="2" fill="#C0C0D4"/>
  <rect x="1" y="11" width="14" height="2" fill="#E0E0D8"/>
  <rect x="15" y="11" width="1" height="2" fill="#C0C0D4"/>
  <!-- bottom chrome hoop row 13 -->
  <rect x="1" y="13" width="14" height="1" fill="#C0C0D4"/>
</svg>
