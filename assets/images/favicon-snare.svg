<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- top rim -->
  <rect x="3" y="0" width="10" height="1" fill="#ffcc33"/>
  <rect x="0" y="1" width="1" height="1" fill="#000000"/>
  <rect x="1" y="1" width="14" height="1" fill="#ffcc33"/>
  <rect x="15" y="1" width="1" height="1" fill="#000000"/>
  <!-- drum head, top -->
  <rect x="0" y="2" width="2" height="2" fill="#000000"/>
  <rect x="2" y="2" width="12" height="2" fill="#fff6e5"/>
  <rect x="14" y="2" width="2" height="2" fill="#000000"/>
  <!-- upper hoop -->
  <rect x="0" y="4" width="2" height="1" fill="#000000"/>
  <rect x="2" y="4" width="12" height="1" fill="#ffcc33"/>
  <rect x="14" y="4" width="2" height="1" fill="#000000"/>
  <!-- shell -->
  <rect x="0" y="5" width="2" height="2" fill="#000000"/>
  <rect x="2" y="5" width="12" height="2" fill="#e2372b"/>
  <rect x="14" y="5" width="2" height="2" fill="#000000"/>
  <!-- lug row -->
  <rect x="0" y="7" width="2" height="1" fill="#000000"/>
  <rect x="2" y="7" width="1" height="1" fill="#e2372b"/>
  <rect x="3" y="7" width="1" height="1" fill="#ff6fa8"/>
  <rect x="4" y="7" width="2" height="1" fill="#e2372b"/>
  <rect x="6" y="7" width="1" height="1" fill="#ff6fa8"/>
  <rect x="7" y="7" width="2" height="1" fill="#e2372b"/>
  <rect x="9" y="7" width="1" height="1" fill="#ff6fa8"/>
  <rect x="10" y="7" width="2" height="1" fill="#e2372b"/>
  <rect x="12" y="7" width="1" height="1" fill="#ff6fa8"/>
  <rect x="13" y="7" width="1" height="1" fill="#e2372b"/>
  <rect x="14" y="7" width="2" height="1" fill="#000000"/>
  <!-- shell -->
  <rect x="0" y="8" width="2" height="2" fill="#000000"/>
  <rect x="2" y="8" width="12" height="2" fill="#e2372b"/>
  <rect x="14" y="8" width="2" height="2" fill="#000000"/>
  <!-- lower hoop -->
  <rect x="0" y="10" width="2" height="1" fill="#000000"/>
  <rect x="2" y="10" width="12" height="1" fill="#ffcc33"/>
  <rect x="14" y="10" width="2" height="1" fill="#000000"/>
  <!-- drum head, bottom -->
  <rect x="0" y="11" width="2" height="2" fill="#000000"/>
  <rect x="2" y="11" width="12" height="2" fill="#fff6e5"/>
  <rect x="14" y="11" width="2" height="2" fill="#000000"/>
  <!-- bottom rim -->
  <rect x="0" y="13" width="1" height="1" fill="#000000"/>
  <rect x="1" y="13" width="14" height="1" fill="#ffcc33"/>
  <rect x="15" y="13" width="1" height="1" fill="#000000"/>
  <rect x="3" y="14" width="10" height="1" fill="#ffcc33"/>
  <!-- crossed drumsticks with outline -->
  <path d="M1 1 L14 14" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 1 L1 14" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M1 1 L14 14" stroke="#f2a93c" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M14 1 L1 14" stroke="#f2a93c" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="1" cy="1" r="1.6" fill="#3ad1c8" stroke="#000000" stroke-width="0.6"/>
  <circle cx="14" cy="1" r="1.6" fill="#3ad1c8" stroke="#000000" stroke-width="0.6"/>
</svg>
