<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- green field -->
  <rect x="0" y="0" width="16" height="16" fill="#009E49"/>
  <!-- gold arrowhead with white fimbriation -->
  <polygon points="0,0.2 0,15 15,7.5" fill="#FFFFFF"/>
  <polygon points="0,1.2 0,14 13.5,7.5" fill="#FCD116"/>
  <!-- drumsticks forming the black border of the inner arrowhead, tips meeting at the point -->
  <path d="M0 3 L9.5 7.5" stroke="#000000" stroke-width="2.2" stroke-linecap="round" shape-rendering="geometricPrecision"/>
  <path d="M0 12 L9.5 7.5" stroke="#000000" stroke-width="2.2" stroke-linecap="round" shape-rendering="geometricPrecision"/>
  <!-- red arrowhead, inset to reveal the black stick border -->
  <polygon points="0,4 0,11 8.6,7.5" fill="#CE1126"/>
  <!-- drumstick bead tips at the hoist edge -->
  <circle cx="0.3" cy="3" r="1.3" fill="#000000"/>
  <circle cx="0.3" cy="12" r="1.3" fill="#000000"/>
</svg>
