  <rect x="2" y="2" width="12" height="1" fill="#5c2a3a"/>
  <rect x="1" y="3" width="14" height="1" fill="#5c2a3a"/>
  <rect x="1" y="4" width="14" height="1" fill="#5c2a3a"/>
  <rect x="0" y="5" width="16" height="6" fill="#5c2a3a"/>
  <rect x="1" y="11" width="14" height="1" fill="#5c2a3a"/>
  <rect x="1" y="12" width="14" height="1" fill="#5c2a3a"/>
  <rect x="2" y="13" width="12" height="1" fill="#5c2a3a"/>
