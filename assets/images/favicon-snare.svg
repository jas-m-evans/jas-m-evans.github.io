  <path d="M14 2 L2 14" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/>
  <circle cx="2" cy="2" r="1.4" fill="#caa06a"/>
  <circle cx="14" cy="2" r="1.4" fill="#caa06a"/>
