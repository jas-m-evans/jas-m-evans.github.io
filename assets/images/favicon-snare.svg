<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- top rim -->
  <rect x="3" y="0" width="10" height="1" fill="#FCD116"/>
  <rect x="0" y="1" width="1" height="1" fill="#000000"/>
  <rect x="1" y="1" width="14" height="1" fill="#FCD116"/>
  <rect x="15" y="1" width="1" height="1" fill="#000000"/>
  <!-- drum head, top -->
  <rect x="0" y="2" width="2" height="2" fill="#000000"/>
  <rect x="2" y="2" width="12" height="2" fill="#FFFFFF"/>
  <rect x="14" y="2" width="2" height="2" fill="#000000"/>
  <!-- upper hoop -->
  <rect x="0" y="4" width="2" height="1" fill="#000000"/>
  <rect x="2" y="4" width="12" height="1" fill="#FCD116"/>
  <rect x="14" y="4" width="2" height="1" fill="#000000"/>
  <!-- shell -->
  <rect x="0" y="5" width="2" height="2" fill="#000000"/>
  <rect x="2" y="5" width="12" height="2" fill="#009E49"/>
  <rect x="14" y="5" width="2" height="2" fill="#000000"/>
  <!-- lug row -->
  <rect x="0" y="7" width="2" height="1" fill="#000000"/>
  <rect x="2" y="7" width="1" height="1" fill="#009E49"/>
  <rect x="3" y="7" width="1" height="1" fill="#CE1126"/>
  <rect x="4" y="7" width="2" height="1" fill="#009E49"/>
  <rect x="6" y="7" width="1" height="1" fill="#CE1126"/>
  <rect x="7" y="7" width="2" height="1" fill="#009E49"/>
  <rect x="9" y="7" width="1" height="1" fill="#CE1126"/>
  <rect x="10" y="7" width="2" height="1" fill="#009E49"/>
  <rect x="12" y="7" width="1" height="1" fill="#CE1126"/>
  <rect x="13" y="7" width="1" height="1" fill="#009E49"/>
  <rect x="14" y="7" width="2" height="1" fill="#000000"/>
  <!-- shell -->
  <rect x="0" y="8" width="2" height="2" fill="#000000"/>
  <rect x="2" y="8" width="12" height="2" fill="#009E49"/>
  <rect x="14" y="8" width="2" height="2" fill="#000000"/>
  <!-- lower hoop -->
  <rect x="0" y="10" width="2" height="1" fill="#000000"/>
  <rect x="2" y="10" width="12" height="1" fill="#FCD116"/>
  <rect x="14" y="10" width="2" height="1" fill="#000000"/>
  <!-- drum head, bottom -->
  <rect x="0" y="11" width="2" height="2" fill="#000000"/>
  <rect x="2" y="11" width="12" height="2" fill="#FFFFFF"/>
  <rect x="14" y="11" width="2" height="2" fill="#000000"/>
  <!-- bottom rim -->
  <rect x="0" y="13" width="1" height="1" fill="#000000"/>
  <rect x="1" y="13" width="14" height="1" fill="#FCD116"/>
  <rect x="15" y="13" width="1" height="1" fill="#000000"/>
  <rect x="3" y="14" width="10" height="1" fill="#FCD116"/>
  <!-- crossed drumsticks, banded like the Golden Arrowhead: black, gold, white, red at center -->
  <path d="M1 1 L14 14" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 1 L1 14" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
  <path d="M2.5 2.5 L12.5 12.5" stroke="#FCD116" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M12.5 2.5 L2.5 12.5" stroke="#FCD116" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M4.5 4.5 L10.5 10.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M10.5 4.5 L4.5 10.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="7.5" cy="7.5" r="1.8" fill="#CE1126" stroke="#000000" stroke-width="0.5"/>
  <!-- stick tip beads -->
  <circle cx="1" cy="1" r="1.6" fill="#FCD116" stroke="#000000" stroke-width="0.6"/>
  <circle cx="14" cy="1" r="1.6" fill="#FCD116" stroke="#000000" stroke-width="0.6"/>
</svg>
