<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Strategy Learner for Algorithmic Trading</title>
  <desc id="desc">Stylized trading chart with buy and sell markers for project card artwork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BC0BE"/>
      <stop offset="100%" stop-color="#9BE564"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#FFFFFF" stroke-width="1">
    <line x1="120" y1="120" x2="1080" y2="120"/>
    <line x1="120" y1="200" x2="1080" y2="200"/>
    <line x1="120" y1="280" x2="1080" y2="280"/>
    <line x1="120" y1="360" x2="1080" y2="360"/>
    <line x1="120" y1="440" x2="1080" y2="440"/>
    <line x1="120" y1="520" x2="1080" y2="520"/>
    <line x1="120" y1="120" x2="120" y2="520"/>
    <line x1="280" y1="120" x2="280" y2="520"/>
    <line x1="440" y1="120" x2="440" y2="520"/>
    <line x1="600" y1="120" x2="600" y2="520"/>
    <line x1="760" y1="120" x2="760" y2="520"/>
    <line x1="920" y1="120" x2="920" y2="520"/>
    <line x1="1080" y1="120" x2="1080" y2="520"/>
  </g>

  <g stroke="#8D99AE" stroke-width="6" stroke-linecap="round">
    <line x1="180" y1="460" x2="180" y2="380"/>
    <line x1="260" y1="420" x2="260" y2="300"/>
    <line x1="340" y1="470" x2="340" y2="390"/>
    <line x1="420" y1="360" x2="420" y2="250"/>
    <line x1="500" y1="390" x2="500" y2="310"/>
    <line x1="580" y1="320" x2="580" y2="220"/>
    <line x1="660" y1="350" x2="660" y2="260"/>
    <line x1="740" y1="300" x2="740" y2="190"/>
    <line x1="820" y1="330" x2="820" y2="250"/>
    <line x1="900" y1="270" x2="900" y2="170"/>
    <line x1="980" y1="290" x2="980" y2="210"/>
  </g>

  <polyline
    points="180,450 260,360 340,430 420,300 500,340 580,250 660,300 740,230 820,270 900,200 980,230"
    fill="none"
    stroke="url(#line)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g>
    <circle cx="420" cy="300" r="18" fill="#2ECC71"/>
    <text x="420" y="307" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B132B">B</text>
    <circle cx="900" cy="200" r="18" fill="#FF6B6B"/>
    <text x="900" y="207" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B132B">S</text>
  </g>

  <text x="120" y="80" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#EAF2F8">
    Strategy Learner
  </text>
  <text x="120" y="560" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#9FB3C8">
    Algorithmic Trading | ML4T
  </text>
</svg>
