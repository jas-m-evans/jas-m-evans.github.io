<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="rpm-title rpm-desc" font-family="IBM Plex Sans, Arial, sans-serif">
  <title id="rpm-title">Sample Raven's Progressive Matrix — 3×3 format</title>
  <desc id="rpm-desc">A representative 3×3 Raven's Progressive Matrix puzzle showing a size-progression pattern. Each row contains a large, medium, and small circle. The bottom-right cell is blank and the solver must identify which of four answer options correctly completes the pattern. Based on the problem structure described in Raven (1938) and Carpenter, Just &amp; Shell (1990).</desc>

  <!-- Background -->
  <rect width="920" height="520" rx="16" fill="#f8fbfb"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#152536">Sample Raven's Progressive Matrix — 3×3 Format</text>
  <text x="460" y="58" text-anchor="middle" font-size="12" fill="#5d6d7e">Pattern: each row applies the same transformation. Which answer completes the bottom-right cell?</text>

  <!-- ============================================================ -->
  <!-- 3×3 MATRIX (left portion) -->
  <!-- ============================================================ -->
  <rect x="20" y="70" width="460" height="380" rx="14" fill="#ffffff" stroke="#c8d8d4" stroke-width="1.5"/>
  <text x="250" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#5d6d7e">Matrix</text>

  <!-- Row dividers -->
  <line x1="20" y1="195" x2="480" y2="195" stroke="#c8d8d4" stroke-width="1"/>
  <line x1="20" y1="320" x2="480" y2="320" stroke="#c8d8d4" stroke-width="1"/>
  <!-- Column dividers -->
  <line x1="173" y1="70" x2="173" y2="450" stroke="#c8d8d4" stroke-width="1"/>
  <line x1="326" y1="70" x2="326" y2="450" stroke="#c8d8d4" stroke-width="1"/>

  <!-- Row 1: large circle, medium circle, small circle -->
  <!-- Cell (1,1): large circle -->
  <circle cx="97" cy="144" r="40" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (1,2): medium circle -->
  <circle cx="250" cy="144" r="27" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (1,3): small circle -->
  <circle cx="403" cy="144" r="15" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>

  <!-- Row 2: large square, medium square, small square -->
  <!-- Cell (2,1): large square -->
  <rect x="57" y="221" width="80" height="80" rx="4" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (2,2): medium square -->
  <rect x="223" y="234" width="54" height="54" rx="4" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (2,3): small square -->
  <rect x="388" y="249" width="30" height="30" rx="4" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>

  <!-- Row 3: large triangle, medium triangle, ??? -->
  <!-- Cell (3,1): large triangle -->
  <polygon points="97,336 57,416 137,416" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (3,2): medium triangle -->
  <polygon points="250,356 223,406 277,406" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <!-- Cell (3,3): BLANK — question mark -->
  <rect x="340" y="335" width="112" height="100" rx="6" fill="#fff8e8" stroke="#c68b12" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="396" y="393" text-anchor="middle" font-size="38" font-weight="700" fill="#c68b12">?</text>

  <!-- ============================================================ -->
  <!-- ANSWER OPTIONS (right portion) -->
  <!-- ============================================================ -->
  <rect x="500" y="70" width="400" height="380" rx="14" fill="#ffffff" stroke="#c8d8d4" stroke-width="1.5"/>
  <text x="700" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#5d6d7e">Answer Options</text>

  <!-- Option labels background circles -->
  <!-- Option 1: small triangle (correct) -->
  <rect x="514" y="103" width="168" height="148" rx="10" fill="#f8fbfb" stroke="#c8d8d4" stroke-width="1"/>
  <text x="528" y="122" font-size="12" font-weight="600" fill="#5d6d7e">1</text>
  <polygon points="598,143 568,193 628,193" fill="#e8f5f3" stroke="#0f766e" stroke-width="2.5"/>
  <text x="598" y="237" text-anchor="middle" font-size="11" fill="#0b4f4a" font-weight="600">✓ Correct</text>

  <!-- Option 2: large triangle (wrong size) -->
  <rect x="694" y="103" width="168" height="148" rx="10" fill="#f8fbfb" stroke="#c8d8d4" stroke-width="1"/>
  <text x="708" y="122" font-size="12" font-weight="600" fill="#5d6d7e">2</text>
  <polygon points="778,120 728,193 828,193" fill="#fef3f3" stroke="#b05050" stroke-width="2.5"/>
  <text x="778" y="237" text-anchor="middle" font-size="11" fill="#b05050">Wrong size</text>

  <!-- Option 3: circle (wrong shape) -->
  <rect x="514" y="263" width="168" height="148" rx="10" fill="#f8fbfb" stroke="#c8d8d4" stroke-width="1"/>
  <text x="528" y="282" font-size="12" font-weight="600" fill="#5d6d7e">3</text>
  <circle cx="598" cy="330" r="18" fill="#fef3f3" stroke="#b05050" stroke-width="2.5"/>
  <text x="598" y="397" text-anchor="middle" font-size="11" fill="#b05050">Wrong shape</text>

  <!-- Option 4: small square (wrong shape) -->
  <rect x="694" y="263" width="168" height="148" rx="10" fill="#f8fbfb" stroke="#c8d8d4" stroke-width="1"/>
  <text x="708" y="282" font-size="12" font-weight="600" fill="#5d6d7e">4</text>
  <rect x="763" y="313" width="30" height="30" rx="4" fill="#fef3f3" stroke="#b05050" stroke-width="2.5"/>
  <text x="778" y="397" text-anchor="middle" font-size="11" fill="#b05050">Wrong shape</text>

  <!-- ============================================================ -->
  <!-- PATTERN EXPLANATION -->
  <!-- ============================================================ -->
  <rect x="20" y="462" width="880" height="44" rx="10" fill="#e8f5f3"/>
  <text x="460" y="479" text-anchor="middle" font-size="12" fill="#0b4f4a" font-weight="600">Pattern detected:</text>
  <text x="460" y="496" text-anchor="middle" font-size="12" fill="#0b4f4a">Each row = same shape, decreasing size (large → medium → small) · Each column = same size, changing shape · Answer: small triangle</text>

  <!-- ============================================================ -->
  <!-- SOURCE CITATION -->
  <!-- ============================================================ -->
  <text x="460" y="516" text-anchor="middle" font-size="10" fill="#8a9aaa">Problem structure based on: Raven, J.C. (1938). Progressive Matrices. H.K. Lewis &amp; Co. · Carpenter, Just &amp; Shell (1990). Psych. Review 97(3).</text>
</svg>
