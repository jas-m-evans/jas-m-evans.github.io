---
layout: single
title: "Projects"
permalink: /projects/
author_profile: true
---

<div class="projects-grid">
  {% assign sorted_projects = site.projects | sort: "title" %}
  {% for project in sorted_projects %}
    <div class="project-item">
      <h2><a href="{{ project.url }}">{{ project.title }}</a></h2>
      <p>{{ project.description }}</p>
    </div>
  {% endfor %}
</div>
