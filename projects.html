---
layout: single
title: "Projects"
permalink: /projects/
author_profile: true
---

<div class="projects-grid">
  {% assign sorted_projects = site.projects | sort: "title" %}
  {% for project in sorted_projects %}
    <div class="project-item">
      {% if project.image %}
        <a href="{{ project.url }}" class="project-item__image-link">
          <img src="{{ project.image }}" alt="{{ project.title }}" class="project-item__image" loading="lazy">
        </a>
      {% endif %}
      <h2><a href="{{ project.url }}">{{ project.title }}</a></h2>
      <p>{{ project.description }}</p>
    </div>
  {% endfor %}
</div>
