<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon-snare.svg' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/images/favicon-snare.svg' | relative_url }}">
<script>
(function() {
  var revision = "{{ site.github.build_revision | default: site.time | date: '%s' }}";
  var links = document.querySelectorAll('link[href*="/assets/css/main.css"]');
  for (var i = 0; i < links.length; i += 1) {
    var href = links[i].getAttribute('href');
    if (!href) {
      continue;
    }
    var hasQuery = href.indexOf('?') !== -1;
    var hasVersion = href.indexOf('v=') !== -1;
    if (hasVersion) {
      continue;
    }
    links[i].setAttribute('href', href + (hasQuery ? '&' : '?') + 'v=' + revision);
  }
})();
</script>
<script>
// The greedy-nav plugin measures menu item widths once on load to decide what
// overflows into the hamburger. If the custom webfonts haven't swapped in yet
// at that point, it measures fallback-font widths and can misjudge things,
// collapsing the whole menu even when there's room. Re-trigger its resize
// handler once fonts are actually ready so it remeasures with final widths.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () {
    window.dispatchEvent(new Event('resize'));
  });
}
</script>
